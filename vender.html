<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vender Veículo - AutoSeguro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">AutoSeguro</a>
            <nav>
                <a href="login.html">Entrar</a>
                <a href="cadastro.html">Cadastre-se</a>
            </nav>
        </div>
    </header>
    
    <main class="container">
        <div class="form-container">
            <h1>Anunciar Veículo</h1>
            <form id="vehicle-form">
                <div class="form-group">
                    <label for="vehicle-type">Tipo de Veículo</label>
                    <select id="vehicle-type" required>
                        <option value="">Selecione...</option>
                        <option value="carro">Carro</option>
                        <option value="moto">Moto</option>
                        <option value="caminhao">Caminhão</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="vehicle-brand">Marca</label>
                    <input type="text" id="vehicle-brand" required placeholder="Ex: Ford">
                </div>
                
                <div class="form-group">
                    <label for="vehicle-model">Modelo</label>
                    <input type="text" id="vehicle-model" required placeholder="Ex: Ka">
                </div>
                
                <div class="form-group">
                    <label for="vehicle-year">Ano</label>
                    <input type="number" id="vehicle-year" min="1900" max="2023" required>
                </div>
                
                <div class="form-group">
                    <label for="vehicle-price">Preço (R$)</label>
                    <input type="number" id="vehicle-price" min="0" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="vehicle-mileage">Quilometragem</label>
                    <input type="number" id="vehicle-mileage" min="0" placeholder="Em km">
                </div>
                
                <div class="form-group">
                    <label for="vehicle-description">Descrição</label>
                    <textarea id="vehicle-description" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="vehicle-photos">Fotos (Máx. 10)</label>
                    <input type="file" id="vehicle-photos" multiple accept="image/*">
                </div>
                
                <button type="submit" class="action-button sell-button">Publicar Anúncio</button>
            </form>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2025 AutoSeguro - Todos os direitos reservados</p>
        </div>
    </footer>
    
    <script src="js/main.js"></script>
</body>
</html>
