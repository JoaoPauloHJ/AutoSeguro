<!DOCTYPE html>
<html>
    <head>
        <title>Cadastro</title>
        <style>

        </style>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/mensagem.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="box">
            <form id="mensagemForm">
                <fieldset>
                    <legend><b>Digite sua Mensagem</b></legend>
                    <br>
                    <div class="inputBox">
                        <input type="text" name="nome" id="nome" class="inputUser" required>
                        <label for="nome" class="labelInput">Nome Completo</label>
                    </div>
                    <br><br>
                    <div class="inputBox">
                        <input type="text" name="email" id="email" class="inputUser" required>
                        <label for="email" class="labelInput">Email</label>
                    </div>
                    <br><br>
                    <div class="inputBox">
                        <input type="tel" name="celular" id="celular" class="inputUser" required>
                        <label for="celular" class="labelInput">Celular</label>
                    </div>
                    <br><br>
                    <div class="inputBox2">
                        <textarea name="mensagem" id="mensagem" class="inputUser2" required></textarea>
                        <label for="mensagem" class="labelInput2">Mensagem</label>
                    </div>
                    <br>
                    <button type="submit">Enviar</button>
                    <br><br>
                </fieldset>
            </form>
            <script>
                document.getElementById("mensagemForm").addEventListener("submit", function(event) {
                    event.preventDefault(); // Evita o reload da página
                    
                    var formData = new FormData(this);
                    var url = "https://script.google.com/macros/s/AKfycbzGYvLdbSZwYEuWv3EX505CymIttd7tUI2pr59mYuVcY5KlvFv_4EXpvExp9IGt0M_i/exec"; 
                    // Cole aqui a URL do Apps Script
            
                    fetch(url, {
                        method: "POST",
                        body: formData
                    })
                    .then(response => response.text())
                    .then(data => {
                        alert("Mensagem enviada com sucesso!");
                        document.getElementById("mensagemForm").reset();
                    })
                    .catch(error => console.error("Erro:", error));
                });
            </script>
            
        </div>
 
        <a href="index.html" class="container__botaoLogin">Voltar</a>
        
    </body>
</html>
