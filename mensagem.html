<!DOCTYPE html>
<html>
    <head>
        <title>Mensagem</title>
        <style>

        </style>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/mensagem.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="box">
            <form id="mensagemForm">
                <fieldset>
                    <legend><b>Digite sua Mensagem</b></legend>
                    <br>
                    <div class="inputBox">
                        <input type="text" name="nome" id="nome" class="inputUser" required>
                        <label for="nome" class="labelInput">Nome Completo</label>
                    </div>
                    <br><br>
                    <div class="inputBox">
                        <input type="text" name="email" id="email" class="inputUser" required>
                        <label for="email" class="labelInput">Email</label>
                    </div>
                    <br><br>
                    <div class="inputBox">
                        <input type="tel" name="celular" id="celular" class="inputUser" required>
                        <label for="celular" class="labelInput">Celular</label>
                    </div>
                    <br><br>
                    <div class="inputBox2">
                        <textarea name="mensagem" id="mensagem" class="inputUser2" required></textarea>
                        <label for="mensagem" class="labelInput2">Mensagem</label>
                    </div>
                    <br>
                    <button id="enviarBtn" class="container__botaoLogin" type="submit">Enviar</button>
                    <br><br>
                </fieldset>
            </form>
            
            <script>
            document.getElementById("mensagemForm").addEventListener("submit", function(event) {
                event.preventDefault(); // Evita que a página recarregue
            
                const enviarBtn = document.getElementById("enviarBtn");
                enviarBtn.innerText = "Enviando...";
                enviarBtn.disabled = true;
            
                const formData = {
                    nome: document.getElementById("nome").value,
                    email: document.getElementById("email").value,
                    celular: document.getElementById("celular").value,
                    mensagem: document.getElementById("mensagem").value
                };
            
                const url = "https://script.google.com/macros/s/AKfycbwFU7ZUYHx7Gqp3AWg62H6DSTkIjG7-L82OFGiYZ2pk6UMLqwKA3ViFf1Tf7aaSr_RoKA/exec"; // Substitua pela sua URL
            
                fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                })
                .then(response => response.json())
                .then(data => {
                    alert("Mensagem enviada com sucesso!");
                    document.getElementById("mensagemForm").reset();
                })
                .catch(error => {
                    console.error("Erro:", error);
                    alert("Houve um erro ao enviar a mensagem.");
                })
                .finally(() => {
                    enviarBtn.innerText = "Enviar";
                    enviarBtn.disabled = false;
                });
            });
            </script>
            
        </div>
 
        <a href="index.html" class="container__botaoLogin">Voltar</a>
        
    </body>
</html>
