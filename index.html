<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>AutoSeguro - Compra e Venda de Veículos</title>
    
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">AutoSeguro</div>
            <nav>
                <a href="#">Entrar</a>
                <a href="#">Cadastre-se</a>
            </nav>
        </div>
    </header>
    
    <main class="main-content">
        <div class="container">
            <h1>Bem-vindo ao AutoSeguro</h1>
            <p>O melhor lugar para comprar e vender veículos online</p>
            
            <div class="buttons-container">
                <button class="action-button buy-button" onclick="window.location.href='comprar.html'">Quero Comprar</button>
                <button class="action-button sell-button" onclick="window.location.href='vender.html'">Quero Vender</button>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2023 AutoSeguro - Todos os direitos reservados</p>
        </div>
    </footer>
</body>
</html>
