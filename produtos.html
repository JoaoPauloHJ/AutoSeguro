<!DOCTYPE html>
<html>

<head>
    <title>Joao & Duda - Produto</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/produto.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <section class="container_links">
        <a href="index.html" class="links">Escolher outro produto</a>
    </section>

    <section class="container__secundario">
        <div class="tamanho__grid">

            <br><br>
            <img id="produto-imagem" src="" alt="Imagem do Produto" class="secundario__imagem imagem2">

            <h2 class="descricao__texto" id="produto-nome"></h2>
            <h2 class="container__valor">R$ 99,00</h2>
            <!-- Botão que abre o modal -->

            <button class="botao-modal" onclick="abrirModal()">🎁 Quero Presentear</button>
            <p class="container__aviso">Clique no botão acima para presentear!</p>
            <!-- Modal -->
            <div class="modal-overlay" id="modal">
                <div class="modal-conteudo">
                    <h2>Como você deseja presentear?</h2>
                    <p>Escolha uma opção:</p>
                    <div class="modal-botoes">
                    <a href="https://checkout.nubank.com.br/DiNnlzaRiG92botq" target="_blank" class="botao-modal-opcao">💳 Pagar agora</a>
                    <a id="botao-presentear" href="produto.link" target="_blank" class="botao-modal-opcao botao-whatsapp">📱 Reservar via WhatsApp e pagar depois!</a>
                    </div>
                    <button class="modal-fechar" onclick="fecharModal()">Fechar</button>

                </div>
            </div>
    </section>
                <!-- <a id="botao-presentear" href = produto.link target="_blank"
                class="container__botao secundario__botao">Presentear!</a>  -->

                <h2 class="dispositivos__titulo">Formas de Presentear: <br><br> Pix, cartão de credito, Cartão de Débito.</h2>

                <h2 class="titulo_pix">Só clicar na imagem abaixo!</h2>
                <br>
                <a target="_blank" href="https://checkout.nubank.com.br/DiNnlzaRiG92botq">
                <img src="img/pagamento.png" class="imagem_pix"></a>
            </div> -->
    <script>
        function abrirModal() {
            document.getElementById("modal").style.display = "flex";
        }

        function fecharModal() {
            document.getElementById("modal").style.display = "none";
        }
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const nomeProduto = params.get('nome');

            const produtos = {
                "liquidificador": {
                    nome: "Liquidificador",
                    imagem: "../img/liquidificador.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20-%20Liquidificador."
                },
                "airfryer": {
                    nome: "Air Fryer",
                    imagem: "../img/airfryer.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20-%20Air%20Fryer."
                },
                "sanduicheira": {
                    nome: "Sanduicheira",
                    imagem: "../img/sandui.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20-%20Sanduicheira."
                },
                "jogodepanelas": {
                    nome: "Jogo De Panelas",
                    imagem: "../img/panelas.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Jogo%20de%20Panelas)."
                },
                "panelaDepressao": {
                    nome: "Panela De Pressao",
                    imagem: "../img/panelapressao.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Panela%20de%20Pressao)."
                },
                "jogodecopos": {
                    nome: "Jogo de Copos",
                    imagem: "../img/jogocopos2.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Jogo%20de%20Copos)."
                },
                "micro-ondas": {
                    nome: "Micro Ondas",
                    imagem: "../img/microondas.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Micro%20-%20Ondas)."
                },
                "escorredor": {
                    nome: "Escorredor de Louças",
                    imagem: "../img/escorredor.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Escorredor%20de%20Louças)."
                },
                "jogoDePratos": {
                    nome: "Jogo de Pratos",
                    imagem: "../img/pratos.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Jogo%20de%20Pratos)."
                },
                "kitUtensilios": {
                    nome: "Kit de Utensilios",
                    imagem: "../img/kitutensilios.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Kit%20de%20Utensilios)."
                },
                "travessaDeVidro": {
                    nome: "Travessa de Vidro",
                    imagem: "../img/TravessaDeVidro.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Travessa%20de%20Vidro)."
                },
                "portaTempero": {
                    nome: "Kit Porta Tempero",
                    imagem: "../img/portatempero.png", // Adicione ../ se necessário
                    link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Kit%20Porta%20Tempero)."
                }
            };

            if (nomeProduto && produtos[nomeProduto]) {
                const produto = produtos[nomeProduto];
                document.getElementById("produto-nome").textContent = produto.nome;
                const imgElement = document.getElementById("produto-imagem");
                imgElement.src = produto.imagem;
                imgElement.alt = produto.nome;
                document.getElementById("botao-presentear").href = produto.link;
            } else {
                document.querySelector(".tamanho__grid").innerHTML = "<h1>Produto não encontrado</h1>";
            }
            if (nomeProduto && produtos[nomeProduto]) {
                const linkWhatsapp = produtos[nomeProduto].link;
                document.getElementById("botao-presentear").href = linkWhatsapp;
            }
        });
    </script>
</body>

</html>
