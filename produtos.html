<body>
    <section class="container_links">
        <a target="_blank" href="https://maps.app.goo.gl/PjCHYqWU3B3oJsFK9" class="links">Localização</a>
        <a href="index.html" class="links">Voltar ao Menu</a>

    <section class="container__secundario">
        <div class="tamanho__grid2">
                <br><br>
                <img id="produto-imagem" src="" alt="Imagem do Produto" class="secundario__imagem imagem2">
        
                <h2 class="descricao__texto" id="produto-nome"></h2>
    
                <p class="container__aviso2">*Clique acima para visitar o site sugerido.</p>
                <a id="botao-presentear" href = produto.link target="_blank"
                class="container__botao secundario__botao">Presentear!</a>
            </div>
            
            <br><br><br>

            <div class="tamanho__grid3">
                
                <h2 class="dispositivos__titulo">Formas de Presentear: <br><br> Pix, cartão de credito, Cartão de Débito.</h2>
                <br><br>
                <h2 class="titulo_pix">Só clicar na imagem abaixo!</h2>
                <br>
                <a target="_blank" href="https://checkout.nubank.com.br/DiNnlzaRiG92botq"><img
                        src="img/pix.png" class="imagem_pix"></a>
            <br><br>
            </div>
    </section>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        const nomeProduto = params.get('nome');

        const produtos = {
            "liquidificador": {
                nome: "Liquidificador",
                imagem: "../img/liquidificador.png", // Adicione ../ se necessário
                link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20-%20Liquidificador."
            },
            "airfryer": {
                nome: "Air Fryer",
                imagem: "../img/airfryer.png", // Adicione ../ se necessário
                link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20-%20Air%20Fryer."
            },
            "sanduicheira": {
                nome: "Sanduicheira",
                imagem: "../img/sandui.png", // Adicione ../ se necessário
                link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20-%20Sanduicheira."
            },
            "jogodepanelas": {
                nome: "Jogo De Panelas",
                imagem: "../img/panelas.png", // Adicione ../ se necessário
                link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Jogo%20de%20Panelas)."
            },
            "panelaDepressao": {
                nome: "Panela De Pressao",
                imagem: "../img/panelapressao.png", // Adicione ../ se necessário
                link: "https://wa.me/5534996920066/?text=Ol%C3%A1,%20Gostaria%20de%20reservar%20esse%20presente%20(Panela%20de%20Pressao)."
            }
        };
        
        if (nomeProduto && produtos[nomeProduto]) {
            const produto = produtos[nomeProduto];
            document.getElementById("produto-nome").textContent = produto.nome;
            const imgElement = document.getElementById("produto-imagem");
            imgElement.src = produto.imagem;
            imgElement.alt = produto.nome;
            document.getElementById("botao-presentear").href = produto.link;
        } else {
            document.querySelector(".tamanho__grid2").innerHTML = "<h1>Produto não encontrado</h1>";
        }
    });
</script>
</body>
</html>
